<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b3551">
  <title>حضور الأنشطة | نادي كلباء الرياضي الثقافي</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    @font-face{font-family:'NotoKufiArabic';src:url('NotoKufiArabic.ttf') format('truetype');font-display:swap}
    :root{--primary:#0b3551;--blue:#2f80ed;--yellow:#f4e733;--card:#fff;--soft:#f7fbfd;--text:#1f2937;--muted:#6b7280;--border:#dfe7ec;--green:#198754;--red:#dc3545;--shadow:0 14px 36px rgba(11,53,81,.10)}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:'NotoKufiArabic',Arial,sans-serif;background:linear-gradient(135deg,#eef6f8,#f8fbfc 55%,#edf6fa);color:var(--text)}
    .page{width:min(1500px,calc(100% - 24px));margin:22px auto}.topbar,.filters,.bulk{background:var(--card);border:1px solid var(--border);box-shadow:var(--shadow)}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap;padding:18px 20px;margin-bottom:18px;border-radius:22px}.title h1{margin:0;color:var(--primary);font-size:25px}.title p{margin:6px 0 0;color:var(--muted);font-size:13px}.logout{width:auto;border:0;border-radius:12px;padding:11px 18px;background:#fff1f2;color:var(--red);font-family:inherit;font-weight:800;cursor:pointer}
    .filters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px;padding:18px;border-radius:20px}.field label{display:block;margin-bottom:7px;color:var(--primary);font-size:13px;font-weight:800}.field input,.field select{width:100%;min-height:48px;padding:11px 13px;border:1px solid var(--border);border-radius:13px;outline:none;background:var(--soft);color:var(--text);font-family:inherit;font-size:14px}.load-btn{align-self:end;min-height:48px;border:0;border-radius:13px;background:var(--yellow);font-family:inherit;font-weight:900;cursor:pointer}
    .stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}.stat{padding:10px 14px;border:1px solid #cfe1ea;border-radius:13px;background:#eaf5fb;color:var(--primary);font-size:13px;font-weight:800}.bulk{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px;padding:14px;border-radius:18px}.bulk select,.bulk button{min-height:44px;padding:9px 12px;border-radius:12px;font-family:inherit}.bulk select{border:1px solid var(--border);background:var(--soft)}.bulk button{border:0;font-weight:800;cursor:pointer}.apply{background:var(--primary);color:#fff}.clear{background:#edf2f5;color:var(--primary)}
    .players{display:grid;gap:14px}.player-card{padding:18px;background:var(--card);border:1px solid var(--border);border-right:5px solid var(--blue);border-radius:20px;box-shadow:0 8px 22px rgba(11,53,81,.06)}.player-head{display:flex;justify-content:space-between;align-items:flex-start;gap:15px;flex-wrap:wrap;margin-bottom:14px}.player-name{margin:0;color:var(--primary);font-size:18px}.player-meta{margin-top:5px;color:var(--muted);font-size:12px}.saved-badge{padding:7px 10px;border-radius:20px;background:#ecfdf3;color:var(--green);font-size:12px;font-weight:800}.activities{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}.activity{display:flex;align-items:center;gap:8px;min-height:46px;padding:10px 12px;border:1px solid var(--border);border-radius:13px;background:var(--soft);cursor:pointer;font-size:13px;font-weight:700}.activity input{width:18px;height:18px;margin:0;accent-color:var(--primary)}.activity.saved{background:#ecfdf3;border-color:#bfe6cf}.activity.saved span::after{content:' ✓ محفوظ';color:var(--green);font-size:11px}
    .bottom-actions{position:sticky;bottom:12px;z-index:20;display:flex;justify-content:center;margin-top:18px;padding:14px;background:rgba(255,255,255,.95);border:1px solid var(--border);border-radius:18px;box-shadow:0 12px 35px rgba(11,53,81,.16)}.save-all{width:min(420px,100%);min-height:50px;border:0;border-radius:14px;background:linear-gradient(135deg,var(--yellow),#ddc900);font-family:inherit;font-size:15px;font-weight:900;cursor:pointer}.message{display:none;margin-bottom:15px;padding:14px;border-radius:14px;font-size:13px;font-weight:800}.message.ok{display:block;background:#ecfdf3;color:var(--green)}.message.error{display:block;background:#fff1f2;color:var(--red)}.message.info{display:block;background:#eaf5fb;color:var(--primary)}.empty{padding:40px 20px;text-align:center;color:var(--muted);background:var(--card);border:1px dashed var(--border);border-radius:20px}.loading{display:none;position:fixed;inset:0;z-index:9999;place-items:center;background:rgba(11,53,81,.25)}.loading.show{display:grid}.loading-box{min-width:250px;padding:24px;text-align:center;background:#fff;border-radius:18px;box-shadow:var(--shadow);color:var(--primary);font-weight:800}
    @media(max-width:1000px){.filters{grid-template-columns:repeat(2,minmax(0,1fr))}.activities{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:600px){.page{width:calc(100% - 14px);margin:8px auto}.filters{grid-template-columns:1fr;padding:13px}.activities{grid-template-columns:1fr 1fr}.player-card{padding:14px}.title h1{font-size:20px}}
  </style>
</head>
<body>
  <div class="page">
    <section class="topbar">
      <div class="title"><h1><i class="fas fa-list-check"></i> حضور الأنشطة</h1><p>تظهر هنا أسماء الأطفال المسجل حضورهم العام في اليوم المختار.</p></div>
      <button class="logout" onclick="logout()"><i class="fas fa-right-from-bracket"></i> تسجيل الخروج</button>
    </section>

    <section class="filters">
      <div class="field"><label for="attendanceDate">التاريخ</label><input type="date" id="attendanceDate"></div>
      <div class="field"><label for="playerSearch">البحث</label><input type="search" id="playerSearch" placeholder="اسم الطفل أو ولي الأمر أو المعرف" oninput="renderPlayers()"></div>
      <div class="field"><label for="viewFilter">عرض</label><select id="viewFilter" onchange="renderPlayers()"><option value="all">جميع الحاضرين</option><option value="unsaved">غير المسجل لهم أنشطة</option><option value="saved">لديهم أنشطة محفوظة</option></select></div>
      <button class="load-btn" onclick="loadAttendance()"><i class="fas fa-rotate"></i> تحميل الحضور</button>
    </section>

    <div id="message" class="message"></div>
    <div class="stats"><div class="stat" id="attendeeCount">عدد الحاضرين: 0</div><div class="stat" id="selectedCount">الاختيارات الجديدة: 0</div></div>

    <section class="bulk"><strong>تحديد جماعي:</strong><select id="bulkActivity"><option value="">اختر النشاط</option></select><button class="apply" onclick="applyBulkActivity(true)">تحديد للجميع الظاهرين</button><button class="clear" onclick="applyBulkActivity(false)">إلغاء من الجميع الظاهرين</button></section>

    <main id="playersContainer" class="players"><div class="empty">اختر التاريخ ثم اضغط تحميل الحضور.</div></main>
    <div class="bottom-actions"><button id="saveButton" class="save-all" onclick="saveAllActivities()"><i class="fas fa-floppy-disk"></i> حفظ جميع الأنشطة المحددة</button></div>
  </div>

  <div id="loading" class="loading"><div class="loading-box"><i class="fas fa-spinner fa-spin"></i><div id="loadingText" style="margin-top:10px">جاري التحميل...</div></div></div>

<script>
if(window.top===window.self){window.location.replace('KSCsummer.html?page='+location.pathname.split('/').pop())}
const ATTENDANCE_SCRIPT='https://script.google.com/macros/s/AKfycbzJwZ7Ulx_pfSOsnpQ-fEicYnXPWsGB7b0k_pTrpglnkFXBPQpU-WEXV7VXYyIQkHh2nw/exec';
const ACTIVITIES=['ورش','زيارات خارجية','شطرنج','كرة قدم','كرة سلة','كرة طائرة','كرة يد','العاب ثقافية','خماسي حديث','لياقة بدنية','ورش تطبيقية','أنشطة بحرية','ورش ذكاء اصطناعي'];
let loggedInUser=localStorage.getItem('attendanceUser');let attendanceRows=[];let todayPlayers=[];let visiblePlayerIds=[];
if(!loggedInUser){alert('يرجى تسجيل الدخول أولاً من صفحة تسجيل الحضور.');window.parent.postMessage({type:'go-to-page',page:'AttendanceScan.html'},'*')}
function getLocalDateValue(date){const y=date.getFullYear(),m=String(date.getMonth()+1).padStart(2,'0'),d=String(date.getDate()).padStart(2,'0');return `${y}-${m}-${d}`}
document.getElementById('attendanceDate').value=getLocalDateValue(new Date());
ACTIVITIES.forEach(a=>{const o=document.createElement('option');o.value=a;o.textContent=a;document.getElementById('bulkActivity').appendChild(o)});
function normalizeArabic(v){return String(v||'').toLowerCase().replace(/[\u064B-\u065F\u0670]/g,'').replace(/ـ/g,'').replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ؤ/g,'و').replace(/ئ/g,'ي').replace(/ة/g,'ه').replace(/\s+/g,' ').trim()}
function normalizeDate(v){if(!v)return'';const t=String(v).trim();if(/^\d{4}-\d{2}-\d{2}$/.test(t))return t;if(/^\d{1,2}\/\d{1,2}\/\d{4}/.test(t)){const [d,m,y]=t.split(' ')[0].split('/');return `${y}-${m.padStart(2,'0')}-${d.padStart(2,'0')}`}const dt=new Date(t);return Number.isNaN(dt.getTime())?'':getLocalDateValue(dt)}
function cleanActivity(v){return String(v||'').trim()}function cleanId(v){return String(v||'').trim()}function esc(v){return String(v||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}
function showLoading(t){document.getElementById('loadingText').textContent=t;document.getElementById('loading').classList.add('show')}function hideLoading(){document.getElementById('loading').classList.remove('show')}function showMessage(t,type='info'){const b=document.getElementById('message');b.className=`message ${type}`;b.textContent=t}
async function loadAttendance(){showLoading('جاري تحميل سجل الحضور...');try{const r=await fetch(`${ATTENDANCE_SCRIPT}?v=${Date.now()}`);if(!r.ok)throw new Error(`HTTP ${r.status}`);const data=await r.json();if(!Array.isArray(data))throw new Error('Bad data');attendanceRows=data;buildTodayPlayers();renderPlayers();showMessage(`تم تحميل ${todayPlayers.length} طفلاً مسجل حضورهم العام.`,'ok')}catch(e){console.error(e);todayPlayers=[];renderPlayers();showMessage('تعذر تحميل الحضور. تحقق من رابط Apps Script وإعدادات النشر.','error')}finally{hideLoading()}}
function getDubaiDateKey(value) {
  if (!value) return "";

  const date = new Date(value);

  if (Number.isNaN(date.getTime())) {
    return normalizeDate(value);
  }

  return date.toLocaleDateString("en-CA", {
    timeZone: "Asia/Dubai"
  });
}
  
function buildTodayPlayers() {
  const selectedDate =
    document.getElementById("attendanceDate").value;

  const playerMap = new Map();

  attendanceRows.forEach(row => {
    const timestamp =
      row.Timestamp ??
      row.timestamp ??
      row.Date ??
      row.date ??
      "";

    const rowDate = getDubaiDateKey(timestamp);

    if (rowDate !== selectedDate) return;

    const id = cleanId(
      row.ID ??
      row.id ??
      row["Player ID"] ??
      row["RegistrationID"]
    );

    if (!id) return;

    const name =
      row["Child Name"] ??
      row.Name ??
      row.name ??
      row["Player Name"] ??
      "";

    const parent =
      row.Parent ??
      row.parent ??
      row["Parent Name"] ??
      "";

    const activity = cleanActivity(
      row.Activity ??
      row.activity ??
      ""
    );

    const generalValue = String(
      row.General ??
      row.general ??
      ""
    ).trim();

    const isGeneralAttendance =
      generalValue === "✔️ حضر" ||
      generalValue === "حضر" ||
      generalValue === "✔ حضر" ||
      activity === "عام" ||
      activity === "الحضور العام";

    if (!playerMap.has(id)) {
      playerMap.set(id, {
        id: id,
        name: name,
        parent: parent,
        hasGeneralAttendance: false,
        savedActivities: new Set(),
        selectedActivities: new Set()
      });
    }

    const player = playerMap.get(id);

    if (!player.name && name) {
      player.name = name;
    }

    if (!player.parent && parent) {
      player.parent = parent;
    }

    if (isGeneralAttendance) {
      player.hasGeneralAttendance = true;
    }

    if (
      activity &&
      activity !== "عام" &&
      activity !== "الحضور العام"
    ) {
      player.savedActivities.add(activity);
    }
  });

  todayPlayers = [...playerMap.values()]
    .filter(player => player.hasGeneralAttendance)
    .sort((a, b) =>
      String(a.name).localeCompare(
        String(b.name),
        "ar"
      )
    );
}
function getFilteredPlayers(){const q=normalizeArabic(document.getElementById('playerSearch').value),words=q.split(/\s+/).filter(Boolean),filter=document.getElementById('viewFilter').value;return todayPlayers.filter(p=>{const txt=normalizeArabic([p.name,p.parent,p.id].join(' '));const ms=!words.length||words.every(w=>txt.includes(w));const hs=p.savedActivities.size>0;const mf=filter==='all'||(filter==='saved'&&hs)||(filter==='unsaved'&&!hs);return ms&&mf})}
function renderPlayers(){const c=document.getElementById('playersContainer'),players=getFilteredPlayers();visiblePlayerIds=players.map(p=>p.id);document.getElementById('attendeeCount').textContent=`عدد الحاضرين: ${todayPlayers.length}`;if(!players.length){c.innerHTML='<div class="empty">لا يوجد أطفال مطابقون للبحث أو التصفية.</div>';updateSelectedCount();return}c.innerHTML=players.map(p=>`<section class="player-card"><div class="player-head"><div><h3 class="player-name">${esc(p.name||'بدون اسم')}</h3><div class="player-meta">ولي الأمر: ${esc(p.parent||'غير معروف')} — المعرف: ${esc(p.id)}</div></div><div class="saved-badge">الأنشطة المحفوظة: ${p.savedActivities.size}</div></div><div class="activities">${ACTIVITIES.map(a=>{const s=p.savedActivities.has(a),n=p.selectedActivities.has(a);return `<label class="activity ${s?'saved':''}"><input type="checkbox" ${s||n?'checked':''} ${s?'disabled':''} onchange="toggleActivity('${encodeURIComponent(p.id)}','${encodeURIComponent(a)}',this.checked)"><span>${esc(a)}</span></label>`}).join('')}</div></section>`).join('');updateSelectedCount()}
function toggleActivity(eid,ea,checked){const id=decodeURIComponent(eid),a=decodeURIComponent(ea),p=todayPlayers.find(x=>x.id===id);if(!p)return;checked?p.selectedActivities.add(a):p.selectedActivities.delete(a);updateSelectedCount()}
function updateSelectedCount(){const n=todayPlayers.reduce((t,p)=>t+p.selectedActivities.size,0);document.getElementById('selectedCount').textContent=`الاختيارات الجديدة: ${n}`}
function applyBulkActivity(select){const a=document.getElementById('bulkActivity').value;if(!a)return alert('اختر النشاط أولاً.');todayPlayers.forEach(p=>{if(!visiblePlayerIds.includes(p.id)||p.savedActivities.has(a))return;select?p.selectedActivities.add(a):p.selectedActivities.delete(a)});renderPlayers()}
async function saveAllActivities(){const records=[];todayPlayers.forEach(p=>p.selectedActivities.forEach(a=>{if(!p.savedActivities.has(a))records.push({player:p,activity:a})}));if(!records.length)return showMessage('لا توجد أنشطة جديدة محددة للحفظ.','info');if(!confirm(`سيتم حفظ ${records.length} سجل نشاط. هل تريد المتابعة؟`))return;document.getElementById('saveButton').disabled=true;let saved=0,failed=0;showLoading(`جاري الحفظ 0 / ${records.length}`);for(const r of records){try{await saveActivityRecord(r.player,r.activity);r.player.savedActivities.add(r.activity);r.player.selectedActivities.delete(r.activity);saved++}catch(e){console.error(e);failed++}document.getElementById('loadingText').textContent=`جاري الحفظ ${saved+failed} / ${records.length}`}hideLoading();document.getElementById('saveButton').disabled=false;renderPlayers();showMessage(failed===0?`تم حفظ ${saved} سجل نشاط بنجاح.`:`تم حفظ ${saved} سجل، وتعذر حفظ ${failed} سجل.`,failed===0?'ok':'error')}
async function saveActivityRecord(p,a){const data=new URLSearchParams();data.append('id',p.id);data.append('name',p.name||'');data.append('parent',p.parent||'');data.append('timestamp',new Date().toISOString());data.append('staff',loggedInUser||'');data.append('activity',a);await fetch(ATTENDANCE_SCRIPT,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:data})}
function logout(){localStorage.removeItem('attendanceUser');window.parent.postMessage({type:'go-to-page',page:'AttendanceScan.html'},'*')}
document.getElementById('attendanceDate').addEventListener('change',loadAttendance);loadAttendance();
</script>
<script>(()=>{const sendSize=()=>{const b=document.body,e=document.documentElement,h=Math.max(b.scrollHeight,b.offsetHeight,b.clientHeight,e.scrollHeight,e.offsetHeight,e.clientHeight);window.parent.postMessage({type:'kalba-iframe-size',height:h},'*')};new MutationObserver(sendSize).observe(document.documentElement,{childList:true,subtree:true,attributes:true,characterData:true});window.addEventListener('load',sendSize,true);window.addEventListener('resize',sendSize);setTimeout(sendSize,100);setTimeout(sendSize,500);setTimeout(sendSize,1000)})();</script>
</body>
</html>
